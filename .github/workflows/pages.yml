name: Harf Adası · GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Ses mantığını ve üretim derlemesini denetle
        run: |
          node tests/audio-unit.cjs
          node tests/adventures-unit.cjs
          node tests/island-unit.cjs
          npm run build
          test ! -f dist/index.php
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: GitHub Pages'e yayımla
        id: deployment
        uses: actions/deploy-pages@v4
