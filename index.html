function word(text){if(view==='syllables'){begin('syllable',text,text,[buildStep(text,[text],'🚂'),{kind:'free',text}]);return}const w=words.find(x=>x.text===text);if(!w)return;if(view==='reading')begin('reading',text,text,[{kind:'read',word:w,text},buildStep(text,w.parts,w.emoji)]);else begin('word',text,text,[buildStep(text,w.parts,w.emoji),{kind:'free',text}])}

else if(s.kind==='trace'){title='“'+s.text+'” yazalım';sub='Sarı noktadan başla, çizginin izini sür.';speech=sub;body=pad(s.text)+`<div class="tools">${button('demo','▶ Nasıl çizilir?','','tool')}${button('clear','🧽 Yeniden çiz','','tool')}</div>`}
else if(s.kind==='free'){title='Şimdi sıra sende';sub='Aşağıya yaz. Bitirince birlikte kontrol edin.';body=`<div class="word" id="freePrompt">${esc(s.text)}</div><div class="controls">${button('hide','Örneği gizle / göster','','')}${button('speak','🔊 Dinle',`data-text="${esc(s.text)}"`,'')}</div>${pad('',true)}<div class="tools">${button('clear','🧽 Temizle','','tool')}${button('review','Yazdım, birlikte bakalım','','tool')}</div><p class="footnote">El yazısı otomatik tanınmaz. Bir büyüğünle kontrol et.</p><div class="controls">${button('paper','Deftere yazdık — birlikte kontrol edelim','','')}</div>`}
else if(s.kind==='build'){title=s.sentence?'Kelimeleri sıraya koyalım':'Parçaları birleştirelim';sub='Kartlara sırayla dokun, boşlukları doldur.';game.bank=shuffle(s.tokens.map((text,id)=>({text,id})));body=`${s.emoji?'<div class="picture">'+s.emoji+'</div>':''}<div class="word" id="buildPrompt">${game.hint?s.parts.map(x=>'<span>'+esc(x)+'</span>').join(''):'?'}</div><div class="controls">${button('hint',game.hint?'İpucunu gizle':'İpucunu göster','','')}${button('speak','🔊 Bütününü dinle',`data-text="${esc(/^\d+$/.test(s.text)?numName(Number(s.text)):s.text)}"`,'')}</div><div class="${s.sentence?'sent':''}"><div class="slots" id="slots"></div><div class="bank" id="bank"></div></div><div class="controls">${button('undo','Son kartı geri al','','')}${button('restart','Yeniden sırala','','')}</div>`}
else if(s.kind==='read'){title='Oku ve resmini bul';sub='Bu kelime hangi resmi anlatıyor?';const used=new Set([s.word.emoji]);const others=shuffle(words.filter(w=>w.read&&w.text!==s.text)).filter(w=>{if(used.has(w.emoji))return false;used.add(w.emoji);return true}).slice(0,2);game.options=shuffle([s.word,...others]);body=`<div class="word">${s.text}</div><div class="controls">${button('speak','🔊 Okurken yardım al',`data-text="${s.text}"`,'')}</div><div class="options read-options">${game.options.map((w,i)=>button('read',`<span aria-hidden="true">${w.emoji}</span>`,`data-index="${i}" aria-label="${w.text} resmi"`,'choice')).join('')}</div>`}
else if(s.kind==='count'){title='Kaç tane elma var?';sub='Elmalara tek tek dokunarak sayabilirsin.';speech='Elmaları say. Kaç tane var?';let options=shuffle([s.n,...shuffle(Array.from({length:11},(_,i)=>i).filter(x=>x!==s.n)).slice(0,2)]);body=`<div class="basket" aria-label="${s.n} elma">${Array.from({length:s.n},(_,i)=>button('apple','🍎',`aria-label="${i+1}. elma" aria-pressed="false"`,'apple')).join('')||'<span>Sepette hiç elma yok.</span>'}</div><div class="options">${options.map(x=>button('count',String(x),`data-number="${x}"`,'choice')).join('')}</div>`}
$('#main').innerHTML=`<section class="lesson"><div class="bar">${button('home','← Oyunlar','','back')}<span>${esc(game.text)}</span>${button('pause','Mola 🌿','','back')}</div><div class="steps" aria-label="${game.i+1}. adım, toplam ${game.steps.length} adım">${game.steps.map((_,i)=>`<span class="${i<game.i?'past':i===game.i?'now':''}">${i<game.i?'★':'☆'}</span>`).join('')}</div><div class="teacher"><div class="face" aria-hidden="true">🦁</div><div class="bubble"><h1>${title}</h1><p>${sub}</p>${speech?button('speak','🔊 Dinle',`data-text="${esc(speech)}"`,''):''}</div></div><div class="exercise">${body}<div class="feedback" id="feedback" role="status" aria-live="polite">Hazır olduğunda başlayabilirsin.</div></div><div class="next-row"><small>${game.i+1} / ${game.steps.length} küçük adım<br>Acelemiz yok.</small>${button('next',game.i===game.steps.length-1?'Tamamla ★':'Devam →','id="next" disabled')}</div><p class="note">🦁 Alparslan: “Adım adım, birlikte.”</p></section>`;
if(s.kind==='trace')trace(s.text,false);if(s.kind==='free')trace('',true);if(s.kind==='build')tiles();}
function tiles(){const s=game.steps[game.i];$('#slots').innerHTML=s.tokens.map((_,i)=>button('slot',game.selected[i]?esc(game.selected[i].text):'',`data-index="${i}" aria-label="${i+1}. boşluk${game.selected[i]?': '+esc(game.selected[i].text):''}"`,'slot '+(i<game.selected.length?'filled':i===game.selected.length?'active':''))).join('');$('#bank').innerHTML=game.bank.map(t=>button('tile',esc(t.text),`data-id="${t.id}" ${game.selected.some(x=>x.id===t.id)?'disabled':''}`,'tile '+(game.selected.some(x=>x.id===t.id)?'used':''))).join('')}
function tile(id){if(game.ready)return;let t=game.bank.find(x=>x.id===id),s=game.steps[game.i];if(!t||game.selected.some(x=>x.id===id))return;if(t.text!==s.tokens[game.selected.length]){feedback('Bir daha bakalım. Sıradaki parça: '+s.tokens[game.selected.length],'nudge');return}game.selected.push(t);tiles();if(game.selected.length===s.tokens.length)ready('“'+s.text+'” hazır! Hazırsan devam edebilirsin.');else feedback('Güzel, şimdi sıradaki parçayı seç.','success')}
function trace(c,free){const svg=$('#pad'),ns='http://www.w3.org/2000/svg';let active=0,drawing=false,points=[],path=null,samples=[],hit=new Set(),valid=0,total=0,length=0,last=null,inkLength=0;const targets=Array.from(svg.querySelectorAll('[data-target]'));const all=targets.map(p=>{let len=p.getTotalLength(),n=Math.max(2,Math.ceil(len/4)+1);return{p,len,pts:Array.from({length:n},(_,i)=>p.getPointAtLength(len*i/(n-1)))}});const dist=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);function coord(e){let r=svg.getBoundingClientRect();return{x:(e.clientX-r.left)*400/r.width,y:(e.clientY-r.top)*340/r.height}}function markers(){let g=$('#markers');if(!g)return;g.innerHTML='';targets.forEach((p,i)=>{p.classList.toggle('active',i===active);p.classList.toggle('finished',i<active)});if(free||active>=all.length)return;let p=all[active].pts[0];g.innerHTML=`<circle class="start" cx="${p.x}" cy="${p.y}" r="15"/><text class="point-no" x="${p.x}" y="${p.y+1}">${active+1}</text>`}function add(p){if(last){let d=dist(last,p);length+=d;if(free)inkLength+=d}points.push(p);path.setAttribute('d',points.map((p,i)=>(i?'L':'M')+p.x.toFixed(1)+' '+p.y.toFixed(1)).join(' '));if(!free){total++;let best=Infinity,idx=0;samples.forEach((s,i)=>{let d=dist(s,p);if(d<best){best=d;idx=i}});if(best<27){valid++;for(let j=Math.max(0,idx-2);j<=Math.min(samples.length-1,idx+2);j++)if(dist(samples[j],p)<27)hit.add(j)}}last=p}
svg.addEventListener('pointerdown',e=>{if(e.pointerType==='mouse'&&e.button!==0||!free&&active>=all.length||drawing)return;cancelAnimationFrame(raf);markers();e.preventDefault();let p=coord(e);samples=free?[]:all[active].pts;if(!free&&dist(p,samples[0])>39){feedback('Sarı noktadan başlayalım.','nudge');return}drawing=true;points=[];hit=new Set();valid=0;total=0;length=0;last=null;path=document.createElementNS(ns,'path');path.setAttribute('class','ink');$('#ink').appendChild(path);try{svg.setPointerCapture(e.pointerId)}catch(_){}add(p)});
svg.addEventListener('pointermove',e=>{if(!drawing)return;e.preventDefault();let p=coord(e),origin=last,n=Math.max(1,Math.ceil(dist(origin,p)/4));for(let i=1;i<=n;i++)add({x:origin.x+(p.x-origin.x)*i/n,y:origin.y+(p.y-origin.y)*i/n})});
function finish(e,cancel=false){if(!drawing)return;drawing=false;try{if(svg.hasPointerCapture(e.pointerId))svg.releasePointerCapture(e.pointerId)}catch(_){}if(free){feedback('Bitirdiğinde “Yazdım, birlikte bakalım” düğmesine dokun.');return}let item=all[active],dot=item.len<12;let ok=!cancel&&(dot?dist(last,item.pts[0])<31:hit.size/samples.length>=.81&&valid/Math.max(1,total)>=.7&&dist(last,item.pts.at(-1))<37&&length>=item.len*.62&&length<item.len*2.1+50);if(ok){active++;markers();if(active===all.length)ready('Çizgiyi tamamladın! Hazır olunca devam et.');else feedback('Şimdi '+(active+1)+'. sarı noktadan başlayalım.','success')}else{path.classList.add('retry');let old=path;setTimeout(()=>old.remove(),950);feedback('Sarı noktadan başlayıp çizginin izini yeniden deneyelim.','nudge')}}
svg.addEventListener('pointerup',e=>finish(e));svg.addEventListener('pointercancel',e=>finish(e,true));game.trace={hasInk:()=>inkLength>=12,clear(){cancelAnimationFrame(raf);drawing=false;active=0;inkLength=0;$('#ink').innerHTML='';game.ready=false;$('#next').disabled=true;markers();feedback(free?'Yazı alanın hazır.':'Sarı noktadan başlayabilirsin.')},demo(){if(free||!all.length)return;cancelAnimationFrame(raf);let item=all[Math.min(active,all.length-1)],g=$('#markers');g.innerHTML='';let dot=document.createElementNS(ns,'circle');dot.setAttribute('r','12');dot.setAttribute('fill','#f4bb45');dot.setAttribute('stroke','white');dot.setAttribute('stroke-width','4');g.appendChild(dot);const start=performance.now(),duration=Math.max(1200,item.len*6);feedback('Sarı noktayı izle. Sonra sen deneyebilirsin.');function tick(now){let f=Math.min(1,(now-start)/duration),p=item.p.getPointAtLength(item.len*f);dot.setAttribute('cx',p.x);dot.setAttribute('cy',p.y);if(f<1)raf=requestAnimationFrame(tick);else markers()}raf=requestAnimationFrame(tick)}};markers();}
function complete(){stop();let id=game.type+':'+game.key;if(!state.done.includes(id)){state.done.push(id);save()}let reward=rewards[Math.min(state.done.length-1,rewards.length-1)]||rewards[0];$('#main').innerHTML=bar()+`<section class="party"><div class="reward">${reward[0]}</div><h1>Emek verdin, tamamladın!</h1><div class="word">${esc(game.text)}</div><p>“${reward[1]}” çıkartması senin.<br>Hazır olduğunda yeni bir oyun seçebilirsin.</p><div class="actions">${button('home','Yeni bir oyun seç')}${button('repeat','Bir daha dene','','btn secondary')}${button('stickers','Çıkartmalarım','','btn secondary')}</div></section>`;window.scrollTo(0,0)}
function stickerPage(){$('#main').innerHTML=bar()+`<div class="heading"><h1>⭐ Çıkartma hazinen</h1><p>Her yeni alıştırma bir keşif. ${state.done.length} farklı alıştırmayı tamamladın.</p></div><div class="stickers">${rewards.map(([emoji,title],i)=>`<div class="sticker ${i>=state.done.length?'locked':''}"><span>${emoji}</span><h3>${title}</h3><small>${i<state.done.length?'Senin oldu!':(i+1)+'. keşifte'}</small></div>`).join('')}</div>`}
function modal(title,body){stop();const d=$('#dialog');d.innerHTML=`<div class="dialog-head"><h2 id="dialogTitle">${title}</h2>${button('close','✕','aria-label="Kapat"','close')}</div>`+body;if(!d.open)d.showModal()}
function close(){let d=$('#dialog');if(d.open)d.close()}
function settings(){modal('Birlikte öğrenelim',`<p>Bugün çalışılacak harfleri seç. Bütün harflere oyun menüsünden her zaman ulaşılabilir.</p><div class="settings">${A.map(l=>button('select-letter',l,`data-letter="${l}" aria-pressed="${state.letters.includes(l)}"`,state.letters.includes(l)?'selected':'')).join('')}</div><div class="controls">${button('all-letters','Tümünü seç','','')}${button('first-letters','İlk harfler: a n e t i l','','')}</div><label class="setting">İpucu başlangıçta görünsün<input id="hint-setting" type="checkbox" ${state.hint?'checked':''}></label><label class="setting">Ses açık<input id="sound-setting" type="checkbox" ${!state.muted?'checked':''}></label><p class="info">İlerleme yalnızca bu tarayıcıda saklanır. Bu oyun el yazısını, çocuğun zekâsını veya bir öğrenme güçlüğünü değerlendirmez. Harflerin cihaz sesi, öğretmenin verdiği ses çalışmasının yerine geçmez.</p>${button('reset','İlerlemeyi sıfırla','','danger')}`)}
function review(paper=false){if(!game)return;if(!paper&&!game.trace?.hasInk()){feedback('Önce yazı alanına yazmayı dene.','nudge');return}modal('Birlikte kontrol edelim',`<p>Yazdığın <strong>${esc(game.steps[game.i].text)}</strong> örneğe benziyor mu? Bir büyüğünle birlikte bak.</p><div class="actions">${button('approve','Birlikte kontrol ettik ✓')}${button('close','Bir daha deneyeceğim','','btn secondary')}</div>`)}
document.addEventListener('change',e=>{if(e.target.id==='hint-setting'){state.hint=e.target.checked;save()}if(e.target.id==='sound-setting'){state.muted=!e.target.checked;save();if(state.muted)stop()}});
document.addEventListener('click',e=>{const b=e.target.closest('[data-do]');if(!b||b.disabled)return;let a=b.dataset.do,s=game?.steps[game.i];if(a==='home')go();else if(a==='catalog')go(b.dataset.view);else if(a==='stickers')go('stickers');else if(a==='adventure')letter(state.recent);else if(a==='letter')letter(b.dataset.letter);else if(a==='word')word(b.dataset.text);else if(a==='sentence'){let text=sentences[Number(b.dataset.index)];begin('sentence',b.dataset.index,text,[buildStep(text,[text],'🌈',true),{kind:'free',text}])}else if(a==='number')number(Number(b.dataset.number));else if(a==='tab'){if(b.dataset.key==='caps')caps=b.dataset.value==='upper';else if(b.dataset.key==='num')numMode=b.dataset.value;else filter=b.dataset.value;catalog()}
else if(a==='sound'){state.muted=!state.muted;save();if(state.muted)stop();else speak('Merhaba! Birlikte oynayalım.')}else if(a==='speak')speak(b.dataset.text);else if(a==='settings')settings();else if(a==='close')close();else if(a==='select-letter'){let l=b.dataset.letter;if(state.letters.includes(l)){if(state.letters.length===1){toast('En az bir harf seçili kalsın.');return}state.letters=state.letters.filter(x=>x!==l)}else state.letters.push(l);save();b.classList.toggle('selected',state.letters.includes(l));b.setAttribute('aria-pressed',String(state.letters.includes(l)))}else if(a==='all-letters'||a==='first-letters'){state.letters=a==='all-letters'?[...A]:['a','n','e','t','i','l'];save();settings()}
else if(a==='reset')modal('İlerleme silinsin mi?',`<p>Bu tarayıcıdaki tamamlanan alıştırmalar ve çıkartmalar silinecek. Bu işlem geri alınamaz.</p><div class="actions">${button('confirm-reset','Evet, sıfırla')}${button('close','Vazgeç','','btn secondary')}</div>`);else if(a==='confirm-reset'){state.done=[];save();go()}
else if(a==='pause')modal('Küçük bir mola 🌿',`<p>Kalemini bırak. Ellerini dinlendir. Hazır olunca kaldığın yerden devam et.</p><div class="actions">${button('close','Oyuna dön')}${button('home','Oyun bahçesi','','btn secondary')}</div>`);
else if(a==='notes')modal('Kendi hızında',`<p>Kısa bir oyun seçin. Önce gösterin, sonra birlikte deneyin. Çocuk bitirmeden sonraki adıma geçmeyin. Yanlışta acele ettirmeden ipucuna dönün; yorulunca mola verin.</p><p>Çizim oyunu yalnızca kılavuzun izlenmesini kontrol eder. Serbest yazıyı birlikte değerlendirin. Seslendirme cihazın Türkçe ses desteğine bağlıdır. İnternet bağlantısı sayfanın ilk açılışı için gereklidir.</p>`);
else if(a==='match'&&game&&!game.ready){if(b.dataset.value===s.text){b.classList.add('ok');$$('.choice').forEach(x=>x.disabled=true);ready('Aynısını buldun! Hazırsan devam edebilirsin.')}else feedback('Bir daha bakalım. Yukarıdaki işarete dikkat et.','nudge')}
else if(a==='read'&&game&&!game.ready){let w=game.options[Number(b.dataset.index)];if(w.text===s.text){b.classList.add('ok');$$('.choice').forEach(x=>x.disabled=true);ready('Kelime ve resim eşleşti!')}else feedback('Kelimeye yeniden bakalım. Okurken yardım alabilirsin.','nudge')}
else if(a==='count'&&game&&!game.ready){if(Number(b.dataset.number)===s.n){b.classList.add('ok');$$('.choice').forEach(x=>x.disabled=true);ready('Saydın ve buldun!')}else feedback('Elmaları bir daha, tek tek sayalım.','nudge')}
else if(a==='apple'){let yes=b.classList.toggle('counted');b.setAttribute('aria-pressed',String(yes))}
else if(a==='tile'&&game)tile(Number(b.dataset.id));else if((a==='undo'||a==='slot')&&game&&s.kind==='build'){if(game.selected.length)game.selected.pop();game.ready=false;$('#next').disabled=true;tiles();feedback('Sıradaki parçayı seçebilirsin.')}
else if(a==='restart'&&game&&s.kind==='build'){game.selected=[];game.bank=shuffle(game.bank);game.ready=false;$('#next').disabled=true;tiles();feedback('İlk parçayı seçebilirsin.')}
else if(a==='hint'&&game){game.hint=!game.hint;$('#buildPrompt').innerHTML=game.hint?s.parts.map(x=>'<span>'+esc(x)+'</span>').join(''):'?';b.textContent=game.hint?'İpucunu gizle':'İpucunu göster'}
else if(a==='hide'&&game){let p=$('#freePrompt');p.textContent=p.textContent==='?'?s.text:'?'}else if(a==='clear'&&game)game.trace?.clear();else if(a==='demo'&&game)game.trace?.demo();else if(a==='review')review();else if(a==='paper')review(true);else if(a==='approve'&&game){close();ready('Birlikte kontrol ettiniz. Hazırsan devam edebilirsin.')}
else if(a==='next'&&game&&game.ready){if(game.i===game.steps.length-1)complete();else{game.i++;step();window.scrollTo(0,0)}}else if(a==='repeat'&&game){game.i=0;step();window.scrollTo(0,0)}});
document.addEventListener('visibilitychange',()=>{if(document.hidden)stop()});$('#dialog').addEventListener('click',e=>{if(e.target===$('#dialog')){let r=e.target.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)close()}});
render();$('#ready').textContent='🟢 Oyun hazır';window.HARF_ADASI_READY=true;
}catch(e){report(e)}})();
</script></body></html>
